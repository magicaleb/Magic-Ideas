<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Swipe Input — Perform</title>
  <script>
    (() => {
      const root = document.documentElement;
      const screenHeight = Math.max(window.innerHeight || 0, window.screen?.height || 0);
      if (screenHeight) root.style.setProperty('--screen-height', `${Math.ceil(screenHeight)}px`);

      try {
        const config = JSON.parse(localStorage.getItem('mpad.swipe') || '{}');
        const key = 'mpad.fast-media.swipe.wallpaper';
        const wallpaper = localStorage.getItem(key) || sessionStorage.getItem(key);
        if (config.fakeHomescreen && wallpaper?.startsWith('data:image/')) {
          root.style.setProperty('--performance-wallpaper', `url(${JSON.stringify(wallpaper)})`);
          root.classList.add('instant-wallpaper');
        }
      } catch (_) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      overscroll-behavior: none;
      touch-action: none;
      background: #000;
      color: #eef2ff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html { width: 100%; min-height: var(--screen-height, 100%); height: var(--screen-height, 100%); background-color: #000; background-image: var(--performance-wallpaper, none); background-position: center center; background-repeat: no-repeat; background-size: cover; }
    body { position: fixed; inset: 0; width: auto; min-height: 0; height: auto; background-color: #000; background-image: var(--performance-wallpaper, none); background-position: center center; background-repeat: no-repeat; background-size: cover; }
    .perform-root { position: fixed; inset: 0; isolation: isolate; overflow: visible; background-color: #000; background-image: var(--performance-wallpaper, none); background-position: center center; background-repeat: no-repeat; background-size: cover; touch-action: none; }
    .wallpaper-layer { position: fixed; top: 0; left: 0; z-index: 0; width: 100vw; min-height: 100%; height: var(--screen-height, 100%); background-color: #000; background-image: var(--performance-wallpaper, none); background-repeat: no-repeat; background-position: center center; background-size: cover; pointer-events: none; }
    .performance-ui { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .tap-practice-grid { display: none; position: absolute; inset: 0; grid-template-columns: repeat(var(--tap-columns), minmax(0, 1fr)); grid-template-rows: repeat(var(--tap-rows), minmax(0, 1fr)); gap: 1px; background: rgba(0,0,0,.12); }
    .perform-root.practice-mode.tap-mode .tap-practice-grid { display: grid; }
    .tap-practice-cell { display: grid; min-width: 0; place-items: center; border: 1px solid rgba(125,211,252,.5); background: rgba(6,12,25,.16); color: rgba(255,255,255,.88); font-size: clamp(.62rem, 2.5vw, .84rem); font-weight: 750; text-align: center; text-shadow: 0 1px 5px #000; overflow: hidden; }
    .tap-practice-cell.empty { color: transparent; }
    .tap-practice-cell.active { background: rgba(45,212,191,.32); }
    .practice-panel { display: none; position: absolute; inset: 0; place-content: center; justify-items: center; gap: 8px; padding: 24px; text-align: center; }
    .perform-root.practice-mode .practice-panel { display: grid; }
    .practice-current { max-width: 100%; color: rgba(235,241,255,.82); font-size: clamp(3.5rem, 17vw, 6.5rem); font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: .08em; overflow-wrap: anywhere; text-shadow: 0 3px 18px rgba(0,0,0,.82); }
    .practice-previous { color: rgba(235,241,255,.66); font-size: .84rem; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0,0,0,.95); }
    .corner-peeks { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); left: max(10px, env(safe-area-inset-left)); display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; }
    .peek { display: block; max-width: 46vw; color: rgba(255,255,255,.82); font-size: clamp(.68rem, 2.8vw, .84rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .05em; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: -1px -1px 2px #000, 1px 1px 3px #000, 0 0 7px #000; }
    .peek-current { text-align: right; }
    .peek output { display: block; }
    .toast { position: fixed; z-index: 2; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px); max-width: calc(100vw - 32px); padding: 9px 13px; border: 1px solid rgba(80,105,175,.55); border-radius: 12px; background: rgba(8,14,31,.88); color: rgba(235,241,255,.82); font-size: .86rem; opacity: 0; transition: opacity .16s, transform .16s; pointer-events: none; text-align: center; }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main id="performRoot" class="perform-root" aria-label="Full-screen swipe input surface">
    <div id="wallpaperLayer" class="wallpaper-layer" aria-hidden="true"></div>
    <div class="performance-ui" aria-hidden="true">
      <div id="tapPracticeGrid" class="tap-practice-grid"></div>
      <div class="practice-panel">
        <output id="practiceCurrent" class="practice-current">—</output>
        <div class="practice-previous">Previous <output id="practicePrevious">—</output></div>
      </div>
      <div class="corner-peeks">
        <output id="peekPrevious" class="peek peek-previous">—</output>
        <output id="peekCurrent" class="peek peek-current">—</output>
      </div>
    </div>
    <div id="liveStatus" class="sr-only" aria-live="polite"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../../assets/js/storage.js?v=6"></script>
  <script src="../../assets/js/clockInput.js?v=6"></script>
  <script src="../../assets/js/inputProfiles.js?v=6"></script>
  <script src="../../assets/js/gestureDetector.js?v=6"></script>
  <script src="../../assets/js/gestures.js?v=6"></script>
  <script src="../../assets/js/swipe.js?v=6"></script>
  <script>
    const WALLPAPER_KEY = 'swipe.wallpaper';
    const state = Swipe.normalizeConfig(Storage.load('swipe', {}));
    Storage.save('swipe', state);

    const root = document.getElementById('performRoot');
    const practiceCurrent = document.getElementById('practiceCurrent');
    const practicePrevious = document.getElementById('practicePrevious');
    const peekCurrent = document.getElementById('peekCurrent');
    const peekPrevious = document.getElementById('peekPrevious');
    const tapPracticeGrid = document.getElementById('tapPracticeGrid');
    const toast = document.getElementById('toast');
    const liveStatus = document.getElementById('liveStatus');
    let wallpaperHandle = null;
    let toastTimer = null;
    let previousValue = '—';

    root.classList.toggle('practice-mode', state.practiceMode);
    root.classList.toggle('tap-mode', state.inputMode === 'tapzones');

    function syncScreenHeight() {
      const screenHeight = Math.max(window.innerHeight || 0, window.screen?.height || 0);
      if (screenHeight) document.documentElement.style.setProperty('--screen-height', `${Math.ceil(screenHeight)}px`);
    }

    function setWallpaperSource(source) {
      const cssValue = source ? `url(${JSON.stringify(source)})` : 'none';
      document.documentElement.style.setProperty('--performance-wallpaper', cssValue);
      document.documentElement.classList.toggle('instant-wallpaper', Boolean(source));
      root.classList.toggle('wallpaper-mode', Boolean(source));
    }

    function renderCurrent(value = '', pending = false, preview = '') {
      const partial = [value, preview].filter(Boolean).join(' ');
      const display = pending ? `${partial}·` : (value || '—');
      peekCurrent.textContent = display;
      practiceCurrent.textContent = display;
    }

    function renderTapPracticeGrid() {
      if (state.inputMode !== 'tapzones') return;
      tapPracticeGrid.style.setProperty('--tap-rows', state.tapGrid.rows);
      tapPracticeGrid.style.setProperty('--tap-columns', state.tapGrid.columns);
      tapPracticeGrid.replaceChildren();
      state.tapGrid.zones.forEach((action) => {
        const cell = document.createElement('span');
        cell.className = `tap-practice-cell${action.kind === 'empty' ? ' empty' : ''}`;
        cell.textContent = InputProfiles.tapActionLabel(action, true);
        tapPracticeGrid.append(cell);
      });
    }

    function renderPrevious(value = '') {
      previousValue = value || '—';
      peekPrevious.textContent = previousValue;
      practicePrevious.textContent = previousValue;
    }

    function showStatus(message) {
      liveStatus.textContent = message;
      if (!state.practiceMode) return;
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('visible');
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 1200);
    }

    function pulse(duration = 12) {
      try { navigator.vibrate?.(duration); } catch (_) {}
    }

    async function applyWallpaper() {
      if (!state.fakeHomescreen) {
        setWallpaperSource('');
        return;
      }

      const instantImage = Storage.loadInstantImage(WALLPAPER_KEY);
      if (instantImage) {
        setWallpaperSource(instantImage);
        return;
      }

      let image = await Storage.loadImage(WALLPAPER_KEY);

      if (!image && state.homescreenImage) {
        try {
          await Storage.saveImage(WALLPAPER_KEY, state.homescreenImage);
          image = await Storage.loadImage(WALLPAPER_KEY);
          state.homescreenImage = '';
          state.hasHomescreenImage = Boolean(image);
          Storage.save('swipe', state);
        } catch (_) {
          image = state.homescreenImage;
        }
      }

      if (!image) {
        showStatus('Wallpaper unavailable — using black performance screen');
        return;
      }

      if (wallpaperHandle) wallpaperHandle.revoke();
      wallpaperHandle = Storage.createImageUrl(image);
      setWallpaperSource(wallpaperHandle.url);
      Storage.saveInstantImage(WALLPAPER_KEY, image);
    }

    const engine = Swipe.start(state, {
      element: root,
      onDigit(digit, buffer) {
        renderCurrent(buffer);
        if (digit !== null) pulse();
      },
      onSequence(result, buffer) {
        if (!result.complete && result.stage !== 'first') renderCurrent(buffer, true, result.preview || '');
      },
      onTapZone(zone) {
        if (!state.practiceMode) return;
        const cell = tapPracticeGrid.children[zone.index];
        if (!cell) return;
        cell.classList.add('active');
        setTimeout(() => cell.classList.remove('active'), 150);
      },
      onClipboard(value, succeeded) {
        if (succeeded) liveStatus.textContent = `${value} copied`;
      },
      onClear() {
        renderCurrent();
        pulse(24);
        showStatus('Cleared');
      },
      onSubmit(value, route) {
        renderPrevious(value);
        renderCurrent();
        pulse([18, 35, 18]);
        showStatus(route === 'shortcut' ? 'Sent to Shortcut' : route === 'clipboard' ? 'Copied and submitted' : 'Submitted');
      },
      onStatus: showStatus,
      onExit() { window.location.assign('settings.html'); }
    });

    renderPrevious();
    renderCurrent();
    renderTapPracticeGrid();
    syncScreenHeight();
    applyWallpaper();
    window.addEventListener('resize', syncScreenHeight);
    window.visualViewport?.addEventListener('resize', syncScreenHeight);
    window.addEventListener('pagehide', (event) => {
      // Keep the engine alive when iOS temporarily parks this page while an
      // optional Shortcut runs and later restores it from the back-forward cache.
      if (event.persisted) return;
      engine.destroy();
      if (wallpaperHandle) wallpaperHandle.revoke();
    });
  </script>
</body>
</html>
