<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Swipe Input — Perform</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #000;
      color: #eef2ff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .perform-root { position: fixed; inset: 0; isolation: isolate; touch-action: none; }
    .wallpaper-layer { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: #000; pointer-events: none; }
    .wallpaper-image { width: 100%; height: 100%; display: none; object-fit: cover; object-position: center center; pointer-events: none; }
    .perform-root.wallpaper-mode .wallpaper-image { display: block; }
    .performance-ui { position: absolute; inset: 0; z-index: 1; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(30px, env(safe-area-inset-bottom)); transition: opacity .12s linear; pointer-events: none; }
    .perform-root.wallpaper-mode .performance-ui { opacity: 0; visibility: hidden; }
    .digits { align-self: center; color: rgba(235,241,255,.76); font-size: clamp(3.5rem, 17vw, 6.5rem); font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: .08em; overflow-wrap: anywhere; text-align: center; text-shadow: 0 3px 18px rgba(0,0,0,.7); }
    .last { display: flex; align-items: center; gap: 8px; color: rgba(220,230,255,.5); font-size: .85rem; }
    .last output { padding: 5px 10px; border-radius: 999px; background: rgba(24,35,70,.75); color: rgba(230,240,255,.72); }
    .toast { position: fixed; z-index: 2; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px); max-width: calc(100vw - 32px); padding: 9px 13px; border: 1px solid rgba(80,105,175,.55); border-radius: 12px; background: rgba(8,14,31,.88); color: rgba(235,241,255,.82); font-size: .86rem; opacity: 0; transition: opacity .16s, transform .16s; pointer-events: none; text-align: center; }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .perform-root.wallpaper-mode + .toast { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main id="performRoot" class="perform-root" aria-label="Full-screen swipe input surface">
    <div class="wallpaper-layer" aria-hidden="true">
      <img id="wallpaperImage" class="wallpaper-image" alt="">
    </div>
    <div class="performance-ui" aria-hidden="true">
      <div id="digits" class="digits">—</div>
      <div class="last">Last submitted <output id="last">none</output></div>
    </div>
    <div id="liveStatus" class="sr-only" aria-live="polite"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../../assets/js/storage.js?v=2"></script>
  <script src="../../assets/js/clockInput.js?v=2"></script>
  <script src="../../assets/js/gestureDetector.js?v=2"></script>
  <script src="../../assets/js/gestures.js?v=2"></script>
  <script src="../../assets/js/swipe.js?v=2"></script>
  <script>
    const WALLPAPER_KEY = 'swipe.wallpaper';
    const state = Swipe.normalizeConfig(Storage.load('swipe', {}));
    Storage.save('swipe', state);

    const root = document.getElementById('performRoot');
    const wallpaperImage = document.getElementById('wallpaperImage');
    const digits = document.getElementById('digits');
    const last = document.getElementById('last');
    const toast = document.getElementById('toast');
    const liveStatus = document.getElementById('liveStatus');
    let wallpaperHandle = null;
    let toastTimer = null;

    function showStatus(message) {
      liveStatus.textContent = message;
      if (root.classList.contains('wallpaper-mode')) return;
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('visible');
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 1200);
    }

    function pulse(duration = 12) {
      try { navigator.vibrate?.(duration); } catch (_) {}
    }

    async function applyWallpaper() {
      if (!state.fakeHomescreen) return;
      let image = await Storage.loadImage(WALLPAPER_KEY);

      if (!image && state.homescreenImage) {
        try {
          await Storage.saveImage(WALLPAPER_KEY, state.homescreenImage);
          image = await Storage.loadImage(WALLPAPER_KEY);
          state.homescreenImage = '';
          state.hasHomescreenImage = Boolean(image);
          Storage.save('swipe', state);
        } catch (_) {
          image = state.homescreenImage;
        }
      }

      if (!image) {
        showStatus('Wallpaper unavailable — using black performance screen');
        return;
      }

      if (wallpaperHandle) wallpaperHandle.revoke();
      wallpaperHandle = Storage.createImageUrl(image);
      wallpaperImage.src = wallpaperHandle.url;
      try {
        if (wallpaperImage.decode) await wallpaperImage.decode();
        else await new Promise((resolve, reject) => { wallpaperImage.onload = resolve; wallpaperImage.onerror = reject; });
        root.classList.add('wallpaper-mode');
      } catch (_) {
        showStatus('Wallpaper could not be displayed — using black performance screen');
      }
    }

    const engine = Swipe.start(state, {
      element: root,
      onDigit(digit, buffer) {
        digits.textContent = buffer || '—';
        if (digit !== null) pulse();
      },
      onSequence(result, buffer) {
        if (!result.complete && result.stage === 'second') {
          digits.textContent = `${buffer || ''}·`;
        }
      },
      onClipboard(value, succeeded) {
        if (succeeded) liveStatus.textContent = `${value} copied`;
      },
      onClear() {
        digits.textContent = '—';
        pulse(24);
        showStatus('Cleared');
      },
      onSubmit(value, route) {
        last.textContent = value;
        digits.textContent = '—';
        pulse([18, 35, 18]);
        showStatus(route === 'shortcut' ? 'Sent to Shortcut' : route === 'clipboard' ? 'Copied and submitted' : 'Submitted');
      },
      onStatus: showStatus,
      onExit() { window.location.assign('settings.html'); }
    });

    applyWallpaper();
    window.addEventListener('pagehide', (event) => {
      // Keep the engine alive when iOS temporarily parks this page while an
      // optional Shortcut runs and later restores it from the back-forward cache.
      if (event.persisted) return;
      engine.destroy();
      if (wallpaperHandle) wallpaperHandle.revoke();
    });
  </script>
</body>
</html>
