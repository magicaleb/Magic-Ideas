<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gesture Input Demo - Magic Ideas</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: none;
        }
        
        /* Prevent iOS from showing navigation UI on touch */
        .back-button[data-href] {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #0b1020;
            color: #eef2ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .demo-container {
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #eef2ff;
        }

        .mode-selector {
            margin: 2rem 0;
            padding: 1rem;
            background: #121a33;
            border-radius: 12px;
            border: 1px solid #1f2a53;
        }

        .mode-selector label {
            display: block;
            margin-bottom: 0.5rem;
            color: #8ea0c7;
            font-size: 1rem;
        }

        .mode-selector select {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid #26325f;
            border-radius: 8px;
            background: #0f1630;
            color: #eef2ff;
            outline: none;
        }

        .feedback-box {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #121a33;
            border-radius: 12px;
            border: 2px solid #60a5fa;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .feedback-message {
            font-size: 1.2rem;
            color: #8ea0c7;
            margin-bottom: 0.5rem;
        }

        .selected-position {
            font-size: 3rem;
            font-weight: bold;
            color: #60a5fa;
            margin: 1rem 0;
        }

        .instruction {
            margin: 1rem 0;
            padding: 1rem;
            background: #0f1630;
            border-radius: 8px;
            color: #8ea0c7;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .swipe-area {
            margin-top: 2rem;
            padding: 3rem;
            background: linear-gradient(135deg, #1f2a53 0%, #26325f 100%);
            border-radius: 12px;
            border: 2px dashed #60a5fa;
            text-align: center;
            color: #8ea0c7;
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        .back-button {
            position: fixed;
            top: 1rem;
            left: 1rem;
            padding: 0.75rem 1.5rem;
            background: #26325f;
            color: #eef2ff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .back-button:hover {
            background: #1f2a53;
        }

        @media (max-width: 600px) {
            .demo-container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .swipe-area {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" data-href="index.html">← Back</button>

    <div class="demo-container">
        <h1>Gesture Input Demo</h1>

        <div class="mode-selector">
            <label for="modeSelect">Select Input Mode:</label>
            <select id="modeSelect">
                <option value="twoswipe">Two-Swipe Clock (digits 0–9)</option>
                <option value="clockface">Direct Clock Face (12 positions)</option>
            </select>
        </div>

        <div class="feedback-box">
            <div class="feedback-message" id="feedbackMessage">First swipe: choose 0, 3, 6, or 9</div>
            <div class="selected-position" id="selectedPosition">—</div>
        </div>

        <div class="instruction" id="instructionText">
            <strong>Two-Swipe Clock:</strong><br>
            First swipe to an anchor: ↑=0, →=3, ↓=6, ←=9.<br>
            Then repeat it or point toward a neighboring digit.
        </div>

        <div class="swipe-area" id="swipeArea">
            👆 Swipe Here
        </div>
    </div>

    <script src="assets/js/clockInput.js?v=2"></script>
    <script src="assets/js/gestureDetector.js?v=2"></script>
    <script src="assets/js/inputModes.js?v=2"></script>
    <script>
        // Get UI elements
        const modeSelect = document.getElementById('modeSelect');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const selectedPosition = document.getElementById('selectedPosition');
        const instructionText = document.getElementById('instructionText');
        const swipeArea = document.getElementById('swipeArea');
        document.querySelector('.back-button').addEventListener('click', () => window.location.assign('index.html'));

        // The demo is intentionally contained to this box. The actual Perform
        // page attaches the same detector to the entire viewport.
        const inputModeManager = new InputModeManager();
        inputModeManager.initialize(swipeArea);

        // Instructions for each mode
        const instructions = {
            clockface: `
                <strong>Direct Clock Face:</strong><br>
                Swipe toward any clock position. Straight up is 12, right is 3,<br>
                down is 6, and left is 9.
            `,
            twoswipe: `
                <strong>Two-Swipe Clock:</strong><br>
                <strong>First:</strong> ↑=0, →=3, ↓=6, ←=9.<br>
                <strong>Second:</strong> repeat the anchor or point toward its neighbor.<br>
                ↑←/↑↑/↑→ = 9/0/1 &nbsp; · &nbsp; →↑/→→/→↓ = 2/3/4<br>
                ↓→/↓↓/↓← = 5/6/7 &nbsp; · &nbsp; ←↓/←←/←↑ = 8/9/0
            `
        };

        // Update mode when selection changes
        modeSelect.addEventListener('change', (e) => {
            const modeName = e.target.value;
            inputModeManager.setMode(modeName);
            updateFeedback();
            instructionText.innerHTML = instructions[modeName];
            selectedPosition.textContent = '—';
        });

        // Handle gesture completion
        inputModeManager.onCompletion((position, result) => {
            const isTwoSwipe = inputModeManager.getCurrentMode().name === 'twoswipe';
            selectedPosition.textContent = isTwoSwipe ? `${result.digit}` : `${position}`;
            feedbackMessage.textContent = isTwoSwipe
                ? `Digit ${result.digit} registered`
                : `Selected ${position} o'clock`;
            
            // Flash the swipe area
            swipeArea.style.background = 'linear-gradient(135deg, #60a5fa 0%, #6ee7b7 100%)';
            setTimeout(() => {
                swipeArea.style.background = 'linear-gradient(135deg, #1f2a53 0%, #26325f 100%)';
                updateFeedback();
            }, 500);
        });

        // Update feedback based on current mode state
        function updateFeedback() {
            const state = inputModeManager.getState();
            if (state) {
                feedbackMessage.textContent = state.message;
                
                if (state.stage === 'second' && state.anchorDigit !== null) {
                    selectedPosition.textContent = `${state.anchorDigit}·`;
                }
            }
        }

        inputModeManager.onStateChange(updateFeedback);

        // Load saved mode preference
        inputModeManager.loadSavedMode();
        const currentMode = inputModeManager.getCurrentMode();
        if (currentMode) {
            modeSelect.value = currentMode.name;
            instructionText.innerHTML = instructions[currentMode.name];
        }

        // Initial feedback update
        updateFeedback();

    </script>
</body>
</html>
